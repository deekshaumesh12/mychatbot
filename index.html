<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Chatbot (local)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">
  <style>
    body { background: #f4dfe7; font-family: 'Shrikhand', cursive; }
    #chat-title { text-align:left; font-size:3rem; font-weight:900; color:#000; margin:10px 0; }
    .container { max-width:900px; margin:20px auto; padding:20px; }
    .main-chat { background:#5b4355; border:4px solid #000; border-radius:18px; padding:18px; min-height:320px; }
    .messages { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px; }
    .msg { background:#fff; color:#000; padding:12px 14px; border-radius:12px; max-width:80%; }
    .msg.user { align-self:flex-end; background:#bb8eb6; }
    .input-row { display:flex; gap:12px; margin-top:14px; }
    .input { flex:1; padding:12px 14px; border-radius:12px; border:4px solid #000; font-size:1rem; }
    .btn { padding:12px 18px; border-radius:12px; border:4px solid #000; background:#000; color:#fff; font-weight:700; }
  </style>
</head>
<body>
  <div class="container">
    <div id="chat-title">your chatbot</div>
    <div class="main-chat">
      <ul id="messages" class="messages"></ul>
    </div>
    <div class="input-row">
      <input id="input" class="input" placeholder="Type a message (try 'hello' or 'help')" />
      <button id="send" class="btn">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function append(role, text) {
      const li = document.createElement('li');
      li.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      li.textContent = text;
      messagesEl.appendChild(li);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function localResponder(text) {
      const t = text.trim();
      const lower = t.toLowerCase();
      if (!t) return '';
      if (lower.includes('hello') || lower.includes('hi')) return 'Hi there — this is a local demo (no external API).';
      if (lower.includes('help')) return "Try typing a question or 'hello'. This is a local demo responder.";
      return `(local) I received your message: ${t}`;
    }

    function sendMessage() {
      const text = inputEl.value;
      if (!text.trim()) return;
      append('user', text);
      inputEl.value = '';
      setTimeout(() => {
        const reply = localResponder(text);
        append('bot', reply);
      }, 200);
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
